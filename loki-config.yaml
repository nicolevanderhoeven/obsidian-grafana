auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Index storage migration (boltdb-shipper/v11 -> tsdb/v13):
# Loki never rewrites existing data. A new period applies from its `from:` date
# (00:00 UTC) onward, and the old period stays so data written before then is
# still readable. Never edit or remove a period that already holds data; only
# append new ones, and always with a `from:` date in the future.
schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h
    - from: 2026-11-04
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

ingester:
  max_chunk_age: 8760h
  chunk_idle_period: 1h
  chunk_retain_period: 30s

# Enable log volume support for Grafana Logs Drilldown
limits_config:
  volume_enabled: true
  max_streams_per_user: 50000
  max_line_size: 256000
  max_entries_limit_per_query: 20000
  allow_structured_metadata: false
  reject_old_samples: true
  reject_old_samples_max_age: 8760h
  unordered_writes: true
  ingestion_rate_mb: 100
  ingestion_burst_size_mb: 200
  per_stream_rate_limit: 50MB
  per_stream_rate_limit_burst: 100MB

# Do not send anonymous usage statistics to Grafana Labs (stats.grafana.org)
analytics:
  reporting_enabled: false
