apiVersion: 1

# Remove any datasource of this name first. Datasources created by older versions of
# this repo got a random uid, and Grafana refuses to start if provisioning tries to
# give an existing datasource a different uid. Deleting by name lets existing installs
# upgrade to the pinned uid below (dashboards reference the uid, not the numeric id).
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus  # pinned: dashboards reference this uid
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true
